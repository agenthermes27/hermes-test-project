[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-test-project"
version = "0.1.0"
description = "Test project for Hermes Agent GitHub integration"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Hermes Agent", email = "agent@hermes.local"}
]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "W", "UP", "B", "C4", "DTZ", "T20", "PTH", "SIM", "RET", "LOG", "ARG", "PAR", "ERA", "PD", "PL", "TRY", "NPY", "PERF", "FA", "ICN", "PIE", "TID", "PYI", "PT", "QF", "RSE", "RUF", "SLF", "SLOT", "TRY", "NPY", "C4", "FURB", "PTH", "SIM", "RET", "LOG", "ARG", "PAR", "ERA", "PD", "PL", "RUF", "TRY", "FA", "ICN", "PIE", "TID", "PYI", "PT", "QF", "RSE", "SIM", "RET", "LOG", "ARG", "PAR", "ERA", "PD", "PL"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
